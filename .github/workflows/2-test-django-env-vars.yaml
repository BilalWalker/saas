name: 2 - Test Django Basic

on:
  workflow_dispatch: 
  push:
    branch:
      - main
jobs:
  test: # name of the job
    runs-on: ubuntu-latest # OS to run the action on
    env:
      DJANGO_DEBUG: 0
      # DJANGO_SECRET_KEY: not-good
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Checkout the code from the repository
      - name: Set up Python
        uses: actions/setup-python@v5 # Set up Python
        with:
          python-version: '3.12' # Python version to use
      - name: Setup Django Secret Key
        run: | 
          MY_GEN_KEY=$(openssl rand -base64 32) # Generate a random secret key
          echo "DJANGO_SECRET_KEY=$MY_GEN_KEY" >> $GITHUB_ENV
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip # Upgrade pip
          pip install -r requirements.txt # Install requirements from requirements.txt
      - name: Django Tests
        working-directory: ./src
        run: |
          python manage.py test
