name: 2 - Test Django Basic

on:
  workflow_dispatch: 
  push:
    branch:
      - main
jobs:
  test: # name of the job
    runs-on: ubuntu-latest # OS to run the action on
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Checkout the code from the repository
      - name: Set up Python
        uses: actions/setup-python@v5 # Set up Python
        with:
          python-version: '3.12' # Python version to use
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip # Upgrade pip
          pip install -r requirements.txt # Install requirements from requirements.txt
      - name: Django Tests
        working-directory: ./src
        run: |
          python manage.py test
